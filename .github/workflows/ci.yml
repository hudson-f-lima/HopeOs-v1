name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  offline-gates:
    name: Gates offline (sem Supabase)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Valores fictícios: estes gates não tocam banco. Auth precisa de token
      # configurado para testar o perímetro; o cliente Supabase só é instanciado.
      API_ACCESS_TOKEN: ci-dummy-token
      SUPABASE_URL: https://example.invalid
      SUPABASE_SECRET_KEY: ci-dummy-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run test:offline
