services:
  # Backend — Node.js/Express API
  - type: web
    name: hopeos-v1
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: API_ACCESS_TOKEN
        sync: false
      - key: DEFAULT_EMPRESA_ID
        sync: false
      - key: CORS_ORIGIN
        sync: false
      # ADR-005 / migration 007 (ver docs/RUNBOOK_MIGRATION_007.md)
      - key: APP_PUBLIC_URL
        sync: false
      - key: LEGACY_TOKEN_AUTH_ENABLED
        value: "true"
      - key: AUTH_TIMEOUT_MS
        value: "5000"
      - key: INTEGRATION_ROTATION_OVERLAP_MIN
        value: "60"
      - key: APP_TIMEZONE
        value: America/Sao_Paulo

  # Frontend — PWA estático
  - type: web
    name: hopeos-v1-frontend
    runtime: static
    buildCommand: ""
    staticPublishPath: .
    pullRequestPreviewsEnabled: false
    headers:
      - path: /service-worker.js
        name: Cache-Control
        value: no-cache
      - path: /manifest.json
        name: Cache-Control
        value: no-cache
      # Segurança (ver backend/tests/e2e/static-server.py, que lê este bloco e
      # injeta os mesmos headers no E2E). A CSP lista toda origem que a PWA usa:
      # API (config.json), Google Fonts (CSS + arquivos). `?apiBase=` apontando
      # para outra API é bloqueado de propósito em produção (connect-src).
      # 'unsafe-inline' só em atributos style= (style-src-attr); <script> e
      # <style> inline continuam proibidos. style-src é o fallback de navegador
      # sem suporte a -elem/-attr.
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com 'unsafe-inline'; style-src-elem 'self' https://fonts.googleapis.com; style-src-attr 'unsafe-inline'; font-src https://fonts.gstatic.com; img-src 'self'; connect-src 'self' https://hopeos-v1.onrender.com; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'"
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: Permissions-Policy
        value: "camera=(), microphone=(), geolocation=(), payment=()"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
